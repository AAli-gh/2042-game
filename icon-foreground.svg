<!-- Adaptive-icon foreground: artwork stays inside the central 66% safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect x="21" y="38" width="66" height="32" rx="9"
        fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1"/>
  <text x="54" y="54.6" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold"
        fill="#eafdff" text-anchor="middle" dominant-baseline="central">2048</text>
</svg>
