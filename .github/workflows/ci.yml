name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aapt apksigner dalvik-exchange zipalign android-sdk-platform-23
      - name: Build
        run: ./android/build.sh "$PWD/build/2048.apk"
      - name: Check the signature and manifest
        run: |
          apksigner verify --verbose --min-sdk-version 21 --max-sdk-version 35 build/2048.apk
          aapt dump badging build/2048.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: 2048-apk
          path: build/2048.apk
          retention-days: 14
