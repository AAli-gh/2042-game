name: Release

# Tag a commit to publish: git tag v1.6.1 && git push origin v1.6.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aapt apksigner dalvik-exchange zipalign android-sdk-platform-23

      # With a keystore in the repository secrets every release is signed with the same key,
      # so players can update in place. Without one the build falls back to a throwaway key
      # and the APK will not install over an existing copy.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$PWD/android/release.keystore"
            echo "KEYSTORE=$PWD/android/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set; signing with a throwaway key, so this APK will not install over an existing copy."
          fi

      - name: Build and verify
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./android/build.sh "$PWD/build/2048.apk"
          apksigner verify --verbose --min-sdk-version 21 --max-sdk-version 35 build/2048.apk
          aapt dump badging build/2048.apk | head -3

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/2048.apk
          generate_release_notes: true
